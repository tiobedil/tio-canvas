name: Publish

# Runs on every push to main. semantic-release reads the commit messages since
# the last tag and, only if a release is due (feat:, fix:, or a breaking change),
# bumps the version, tags it, creates a GitHub release, and publishes to npm.
# Commits like docs:, ci:, chore:, or refactor: publish nothing.
# Config: .releaserc.json. npm publish uses trusted publishing (no npm token).
on:
  push:
    branches:
      - main

permissions:
  contents: write # push the version tag and create the GitHub release
  issues: write # semantic-release comments on linked issues
  pull-requests: write # semantic-release comments on linked pull requests
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full tag history

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm (trusted publishing needs npm 11.5.1+)
        run: npm install -g npm@latest

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
