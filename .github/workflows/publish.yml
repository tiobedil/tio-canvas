name: Publish

# Publishes to npm when a version tag like v0.1.1 is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing) and add provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Upgrade npm (trusted publishing needs npm 11.5.1+)
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --provenance --access public
