<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Update states</title>
  <link rel="stylesheet" href="/canvas/canvas.css">
  <link rel="stylesheet" href="/prototypes/update-states.css">
  <style>
    /* The menu is shown open and the dialog inline, so both can be judged at once. */
    #layers-menu { top: 69px; left: 129px; }
    #update { position: fixed; inset: 0; margin: auto; }
  </style>
</head>
<body data-ready>
  <aside id="layers" class="canvas-tools layers-drawer" aria-label="Screens">
    <header class="layers-header">
      <h2 id="layers-title"><span class="layers-logo" role="img" aria-label="Tio"></span><span id="screens-count" hidden>0</span></h2>
      <button id="layers-more" type="button" aria-label="More" aria-haspopup="menu" aria-controls="layers-menu" popovertarget="layers-menu" data-tooltip="More"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5h.01M10 10h.01M10 15.5h.01" stroke-width="2.5"/></svg><span class="update-dot"></span></button>
      <button id="layers-toggle" hidden type="button" aria-label="Minimize Layers" aria-controls="layers-list" aria-expanded="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path/></svg></button>
    </header>
    <ol id="layers-list" hidden aria-label="Layers, top layer first"></ol>
  </aside>
  <div id="layers-menu" class="canvas-tools" popover="manual" role="menu" aria-label="More" tabindex="-1">
    <button id="theme" type="button" role="menuitem"><svg class="theme-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 1 0 14Z"/></svg><span id="theme-label">Dark mode</span></button>
    <button id="shortcuts-open" type="button" role="menuitem"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5.5C8.6 4.4 6.6 4 3.5 4v11c3.1 0 5.1.4 6.5 1.5m0-11C11.4 4.4 13.4 4 16.5 4v11c-3.1 0-5.1.4-6.5 1.5m0-11v11"/></svg>Guide &amp; hotkeys</button>
    <button id="onboarding-open" type="button" role="menuitem"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M8.2 8a1.9 1.9 0 1 1 2.9 1.6c-.7.4-1.1.8-1.1 1.6M10 14h.01"/></svg>Onboarding</button>
    <hr role="separator">
    <button id="changelog-open" type="button" role="menuitem"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 3h9a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1ZM7.5 7h5M7.5 10h5M7.5 13h3"/></svg>Change log</button>
    <button id="install-open" type="button" role="menuitem"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 14v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2"/></svg>Install in a project</button>
    <hr role="separator">
    <div class="menu-version"><span id="version-label">v0.1.3</span><button id="update-open" type="button" role="menuitem" data-primary>Update</button></div>
  </div>
  <dialog id="update" class="page-picker" aria-labelledby="update-title" open>
    <header class="layers-header"><h2 id="update-title">Update</h2><button type="button" aria-label="Close Update">✕</button></header>
    <div class="shortcuts-body update-body"></div>
  </dialog>
  <script type="module" src="/prototypes/update-states.js"></script>
</body>
</html>
