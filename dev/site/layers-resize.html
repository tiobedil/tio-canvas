<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Layers resize</title>
  <link rel="stylesheet" href="/canvas/ui/tokens.css">
  <link rel="stylesheet" href="/canvas/ui/ui.css">
  <link rel="stylesheet" href="/canvas/canvas.css">
  <link rel="stylesheet" href="/prototypes/layers-resize.css">
  <style>
    body { margin: 0; min-height: 100vh; background: var(--canvas-bg, #f4f4f4); color: var(--canvas-text); font: 13px/1.45 system-ui, sans-serif; }
    body { background-image: radial-gradient(var(--canvas-line) 1px, transparent 1px); background-size: 16px 16px; }
    /* Empty or collapsed: as wide as its content. Expanded: the dragged width. */
    .layers-drawer[data-empty], .layers-drawer[data-collapsed] { width: max-content; }
    /* The logo keeps its auto right margin in every state, so while the width
       animates the buttons ride the right edge instead of jumping. The logo gap is
       padding on the logo; the buttons keep --canvas-gap between themselves. */
    .layers-drawer .ui-header { gap: 0; }
    .layers-drawer .ui-header > h2 ~ * + * { margin-left: var(--canvas-gap); }
    .layers-drawer .ui-header > h2 { padding-right: var(--canvas-gap); }
    .layers-drawer[data-collapsed] .ui-header > h2 { padding-right: var(--collapsed-gap, var(--canvas-gap)); }
    .layers-drawer[data-empty] .ui-header > h2 { padding-right: var(--empty-gap, var(--canvas-gap)); }
    .layers-grip { position: absolute; top: 0; right: 0; bottom: 0; width: 8px; cursor: ew-resize; touch-action: none; }
    .layers-grip[hidden] { display: none; }
    body[data-resizing], body[data-resizing] * { cursor: ew-resize !important; user-select: none; }
    .demo-arrow { position: fixed; left: 50%; top: 50%; width: 600px; translate: -50% -50%; color: var(--canvas-text); }
  </style>
</head>
<body data-ready>
  <!-- Drag the right edge of the expanded Layers panel past its limits. -->
  <script type="module" src="/prototypes/layers-resize.js"></script>
</body>
</html>
